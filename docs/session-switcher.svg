<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" font-family="Menlo, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14">
  <title>session-switcher: the Sessions pane next to the conversation (example data)</title>
  <rect width="1100" height="380" rx="10" fill="#1e1e1e"/>
  <path d="M0 10a10 10 0 0 1 10-10h1080a10 10 0 0 1 10 10v20H0z" fill="#2d2d2d"/>
  <circle cx="20" cy="15" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="15" r="6" fill="#febc2e"/>
  <circle cx="60" cy="15" r="6" fill="#28c840"/>
  <text x="550" y="20" fill="#9a9a9a" text-anchor="middle" font-size="12">~/work/demo-app — claude</text>

  <!-- conversation -->
  <rect x="12" y="50" width="420" height="24" fill="#2a2a2a"/>
  <text x="20" y="67" fill="#d4d4d4"><tspan fill="#9a9a9a">❯</tspan> add a dark mode toggle to settings</text>
  <text x="20" y="102" fill="#d4d4d4">● Added a <tspan fill="#9cdcfe">ThemeToggle</tspan> component to the</text>
  <text x="20" y="122" fill="#d4d4d4">&#160;&#160;settings page; the choice is saved per user.</text>
  <text x="20" y="156" fill="#9a9a9a">✻ Worked for 42s</text>
  <rect x="12" y="176" width="140" height="24" fill="#2a2a2a"/>
  <text x="20" y="193" fill="#d4d4d4"><tspan fill="#9a9a9a">❯</tspan> /sessions</text>
  <text x="20" y="217" fill="#9a9a9a">&#160;&#160;⎿ Sessions: press 1-9 or Enter to resume</text>
  <text x="20" y="318" fill="#7a7a7a">☰ Sessions</text>
  <line x1="12" y1="330" x2="560" y2="330" stroke="#444"/>
  <text x="20" y="354" fill="#d4d4d4"><tspan fill="#9a9a9a">❯</tspan> ▌</text>

  <!-- sessions pane -->
  <line x1="576" y1="30" x2="576" y2="380" stroke="#555"/>
  <text x="592" y="56" fill="#d4d4d4" font-weight="bold">Sessions</text>
  <text x="592" y="82" fill="#7a7a7a">Refresh&#160;&#160;Close&#160;&#160;Search</text>
  <text x="592" y="106" fill="#d4d4d4">Search: <tspan fill="#7a7a7a">session name or worktree</tspan></text>
  <text x="592" y="128" fill="#7a7a7a" font-size="12">1-9 resume · s search · r refresh · x close · Esc back</text>
  <text x="592" y="160" fill="#4ec94e" font-weight="bold">▸ Add dark mode toggle<tspan fill="#7a7a7a" font-weight="normal">&#160;&#160;(this session)</tspan></text>
  <rect x="588" y="168" width="224" height="22" fill="#264f78"/>
  <text x="592" y="184" fill="#ffffff">1: Fix login redirect loop<tspan fill="#7a7a7a">&#160;&#160;3m ago</tspan></text>
  <text x="592" y="208" fill="#d4d4d4">2: Add search endpoint<tspan fill="#7a7a7a">&#160;&#160;[feat-search] 12m ago</tspan></text>
  <text x="592" y="232" fill="#d4d4d4">3: Write API docs<tspan fill="#7a7a7a">&#160;&#160;1h ago</tspan></text>
  <text x="592" y="256" fill="#d4d4d4">4: Upgrade to Node 22<tspan fill="#7a7a7a">&#160;&#160;[upgrade-node] 3h ago</tspan></text>
  <text x="592" y="280" fill="#d4d4d4">5: Debug flaky e2e test<tspan fill="#7a7a7a">&#160;&#160;1d ago</tspan></text>
  <text x="592" y="304" fill="#d4d4d4">6: Review PR #42<tspan fill="#7a7a7a">&#160;&#160;[review-42] 2d ago</tspan></text>
  <text x="592" y="328" fill="#d4d4d4">7: Set up CI cache<tspan fill="#7a7a7a">&#160;&#160;4d ago</tspan></text>
</svg>
